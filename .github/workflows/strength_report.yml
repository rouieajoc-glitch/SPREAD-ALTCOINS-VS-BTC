name: Strength vs BTC daily report

on:
  schedule:
    # Main trigger is cron-job.org at 08:05 Manila. These GitHub schedules are only backups
    # (GitHub often starts them hours late); they stop at once if the report was already sent.
    - cron: "5 0 * * *"    # 08:05 Manila
    - cron: "23 0 * * *"   # 08:23 Manila
    - cron: "41 0 * * *"   # 08:41 Manila
    - cron: "13 1 * * *"   # 09:13 Manila
    - cron: "47 1 * * *"   # 09:47 Manila
    - cron: "37 2 * * *"   # 10:37 Manila (last safety net)
  workflow_dispatch:         # "Run workflow" button (always sends) + cron-job.org trigger at 08:05 (force=false)
    inputs:
      force:
        description: "Send even if today's report was already sent"
        type: boolean
        default: true

permissions:
  contents: write            # lets the job save data/strength_log.csv back to the repo

concurrency:
  group: strength-report     # never run two attempts at the same time
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Build and send report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: python strength_report.py

      - name: Save journal
        run: |
          git config user.name "strength-bot"
          git config user.email "strength-bot@users.noreply.github.com"
          git add data/strength_log.csv || true
          git diff --cached --quiet || git commit -m "journal: $(date -u +%F)"
          git push
